name: Source links and content review
on:
  schedule:
    - cron: '19 7 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run audit:content
      - name: Preserve link review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-review-report
          path: output/source-audit.*
          retention-days: 30
